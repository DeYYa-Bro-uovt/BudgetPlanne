<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f766e">
<title>Budget Planner</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#1b1f24;--muted:#6b7480;--line:#e3e6ea;--brand:#0f766e;--brand-t:#fff;--inc:#15803d;--exp:#b91c1c;--warn:#b45309;--track:#e9ecef}
@media(prefers-color-scheme:dark){:root{--bg:#0f1316;--card:#171c21;--text:#e8ebee;--muted:#98a1ab;--line:#262d34;--brand:#2dd4bf;--brand-t:#06201c;--inc:#4ade80;--exp:#f87171;--warn:#fbbf24;--track:#262d34}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:880px;margin:0 auto;padding:16px 16px 64px}
h1{font-size:22px;margin:0}h2{font-size:17px;margin:22px 0 10px}h3{font-size:15px;margin:0}
.muted{color:var(--muted)}.small{font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.grow{flex:1 1 auto}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat .l{font-size:12px;color:var(--muted)}.stat .v{font-size:20px;font-weight:650;margin-top:2px}
.inc{color:var(--inc)}.exp{color:var(--exp)}.warn{color:var(--warn)}
button,.btn{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--text);padding:8px 12px;border-radius:9px;cursor:pointer}
button:hover{border-color:var(--muted)}
button.primary{background:var(--brand);color:var(--brand-t);border-color:var(--brand);font-weight:600}
button.danger{color:var(--exp)}
button.link{border:0;background:none;padding:4px 6px;color:var(--brand)}
button.link.danger{color:var(--exp)}
input,select{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:8px 10px;min-width:0}
label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
form.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end}
.tabs{display:flex;gap:6px;margin:14px 0;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;border-bottom:2px solid transparent;border-radius:0;background:none;padding:10px 14px;color:var(--muted);white-space:nowrap}
.tabs button.on{color:var(--text);border-bottom-color:var(--brand);font-weight:600}
.bar{height:8px;background:var(--track);border-radius:99px;overflow:hidden;margin:8px 0 6px}
.bar i{display:block;height:100%;border-radius:99px;background:var(--brand)}
.bar i.over{background:var(--exp)}.bar i.warn{background:var(--warn)}.bar i.ok.in{background:var(--inc)}
.chip{font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.over{color:var(--exp);border-color:var(--exp)}.chip.warn{color:var(--warn);border-color:var(--warn)}.chip.ok{color:var(--inc);border-color:var(--inc)}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;font-size:13px}
.nums b{display:block;font-size:15px}
.tx{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.tx:last-child{border-bottom:0}
.tx .d{width:74px;font-size:12px;color:var(--muted);flex:none}
.tx .m{flex:1;min-width:0}.tx .m div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx .a{font-weight:600;white-space:nowrap}
.empty{text-align:center;color:var(--muted);padding:26px 10px}
svg{width:100%;height:auto;display:block}
.seg{display:flex;gap:6px}
.crumb{display:inline-flex;align-items:center;gap:6px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<input type="file" id="importFile" accept="application/json" hidden>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
"use strict";
/* ===== Cloud sync settings (see SETUP.md). Leave empty to use this device only. ===== */
const SUPABASE_URL = "https://lvniuntvsyehgrlgdjte.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_QBPzDlO3JtBDJruHAHDFZw_olFfSlnI";

const KEY = "budget-planner-v1";
let S = load();
const ui = { planId: null, tab: "items", editItem: null, filter: "all", txTarget: "", txDate: "" };

/* ---------- storage ---------- */
function load() {
  try {
    const d = JSON.parse(localStorage.getItem(KEY));
    if (d && Array.isArray(d.plans)) return d;
  } catch (e) {}
  return { currency: "", plans: [] };
}
function save(bump = true) {
  if (bump) S.updatedAt = new Date().toISOString();
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch (e) { alert("Could not save data in this browser. Use Backup to keep a copy."); }
  if (bump) schedulePush();
}

/* ---------- cloud sync (Supabase) ---------- */
const sync = { client: null, user: null, status: "local", msg: "", timer: null, ready: false };
const cloudOn = () => !!(SUPABASE_URL && SUPABASE_ANON_KEY && window.supabase);
function badge() {
  if (!sync.user) return "";
  return { synced: "Synced ✓", saving: "Saving…", syncing: "Syncing…", error: "Sync problem: " + (sync.msg || "unknown") }[sync.status] || "";
}
function setStatus(st, msg) {
  sync.status = st; sync.msg = msg || "";
  document.querySelectorAll("[data-sync]").forEach(el => { el.textContent = badge(); });
}
function schedulePush() {
  if (!sync.user) return;
  setStatus("saving");
  clearTimeout(sync.timer);
  sync.timer = setTimeout(push, 1200);
}
async function push() {
  if (!sync.user) return;
  clearTimeout(sync.timer);
  if (!S.updatedAt) S.updatedAt = new Date().toISOString();
  const { error } = await sync.client.from("budget_data").upsert({ user_id: sync.user.id, data: JSON.parse(JSON.stringify(S)), updated_at: S.updatedAt });
  setStatus(error ? "error" : "synced", error && error.message);
}
async function pull(initial) {
  if (!sync.user) return;
  setStatus("syncing");
  const { data: row, error } = await sync.client.from("budget_data").select("data,updated_at").eq("user_id", sync.user.id).maybeSingle();
  if (error) return setStatus("error", error.message);
  if (!row) return push();                       // first time: upload what is on this device
  const cloudAt = Date.parse(row.updated_at), localAt = S.updatedAt ? Date.parse(S.updatedAt) : 0;
  const useCloud = () => { S = row.data; S.updatedAt = row.updated_at; save(false); render(); setStatus("synced"); };
  const cloudPlans = (row.data && row.data.plans) || [];
  if (initial && S.plans.length && cloudPlans.length && JSON.stringify(S.plans) !== JSON.stringify(cloudPlans)) {
    if (confirm("Your cloud account already has data that differs from the data on this device.\n\nOK = use the cloud data (replaces this device's data)\nCancel = keep this device's data (replaces the cloud data)")) useCloud();
    else { S.updatedAt = new Date().toISOString(); save(false); await push(); }
    return;
  }
  if (cloudAt > localAt) useCloud();
  else if (localAt > cloudAt) await push();
  else setStatus("synced");
}
async function authenticate(kind) {
  const email = document.getElementById("authEmail").value.trim(), password = document.getElementById("authPass").value;
  if (!email || password.length < 6) return alert("Enter your email and a password of at least 6 characters.");
  const r = kind === "signup" ? await sync.client.auth.signUp({ email, password }) : await sync.client.auth.signInWithPassword({ email, password });
  if (r.error) return alert(r.error.message);
  if (kind === "signup" && !r.data.session) alert("Account created. Check your email to confirm it, then sign in.");
}
async function signOut() {
  if (!confirm("Sign out? Your data stays in the cloud and will be removed from this device.")) return;
  if (sync.status === "saving") await push();
  await sync.client.auth.signOut();
  S = { currency: S.currency || "", plans: [] }; ui.planId = null; save(false); render();
}
async function initSync() {
  if (!cloudOn()) return;
  sync.client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const { data } = await sync.client.auth.getSession();
  sync.user = data.session ? data.session.user : null;
  sync.ready = true; render();
  if (sync.user) pull(true);
  sync.client.auth.onAuthStateChange((ev, session) => {
    const u = session ? session.user : null;
    const changed = (u ? u.id : null) !== (sync.user ? sync.user.id : null);
    sync.user = u;
    if (changed) { render(); if (u) setTimeout(() => pull(true), 0); }
  });
  document.addEventListener("visibilitychange", () => { if (!document.hidden && sync.user && sync.status !== "saving") pull(false); });
}
function accountCard() {
  if (!cloudOn()) return `<div class="card muted small">Cloud sync is off, data stays on this device. To sync between devices, follow SETUP.md.</div>`;
  if (!sync.ready) return "";
  if (sync.user) return `<div class="card row between"><div><div class="small muted">Signed in as</div><b>${esc(sync.user.email)}</b> · <span class="small muted" data-sync>${badge()}</span></div>
    <div class="row"><button data-action="sync-now">Sync now</button><button data-action="signout">Sign out</button></div></div>`;
  return `<form class="card f" data-form="auth">
    <label>Email<input id="authEmail" type="email" required autocomplete="email"></label>
    <label>Password<input id="authPass" type="password" required minlength="6" autocomplete="current-password"></label>
    <button class="primary" type="submit">Sign in</button><button type="button" data-action="signup">Create account</button></form>
    <p class="muted small" style="margin:-4px 0 12px">Sign in to sync your plans between your phone and computer.</p>`;
}

/* ---------- helpers ---------- */
const uid = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const money = n => (S.currency ? esc(S.currency) + " " : "") + Number(n || 0).toLocaleString(undefined, { minimumFractionDigits: 0, maximumFractionDigits: 2 });
const num = v => { const n = Number(String(v).replace(/,/g, "").trim()); return isFinite(n) ? n : NaN; };
const pad = n => String(n).padStart(2, "0");
const iso = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const parse = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const todayISO = () => iso(new Date());
const daysBetween = (a, b) => Math.round((parse(b) - parse(a)) / 864e5);
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
const niceDate = s => parse(s).toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" });
const shortDate = s => parse(s).toLocaleDateString(undefined, { day: "numeric", month: "short" });
const cur = () => S.plans.find(p => p.id === ui.planId) || null;
const sum = (arr, f) => arr.reduce((s, x) => s + f(x), 0);

/* ---------- calculations ---------- */
function stats(p) {
  const items = p.items.map(it => {
    const actual = sum(p.tx.filter(t => t.itemId === it.id), t => t.amount);
    return { ...it, actual, remaining: it.planned - actual, pct: it.planned > 0 ? actual / it.planned * 100 : (actual > 0 ? 999 : 0) };
  });
  const inc = p.tx.filter(t => t.type === "income"), exp = p.tx.filter(t => t.type === "expense");
  const plannedIncome = sum(items.filter(i => i.type === "income"), i => i.planned);
  const plannedExpense = sum(items.filter(i => i.type === "expense"), i => i.planned);
  const actualIncome = sum(inc, t => t.amount), actualExpense = sum(exp, t => t.amount);
  return {
    items, plannedIncome, plannedExpense, actualIncome, actualExpense,
    plannedNet: plannedIncome - plannedExpense, actualNet: actualIncome - actualExpense,
    unplannedExpense: sum(exp.filter(t => !t.itemId), t => t.amount),
    unplannedIncome: sum(inc.filter(t => !t.itemId), t => t.amount)
  };
}
function status(it) {
  if (it.type === "expense") {
    if (it.pct > 100) return { c: "over", t: "Over budget" };
    if (it.pct >= 80) return { c: "warn", t: "Near limit" };
    return { c: "ok", t: "On track" };
  }
  return it.planned > 0 && it.actual >= it.planned ? { c: "ok", t: "Received" } : { c: "", t: "Pending" };
}

/* ---------- views ---------- */
function render() {
  const p = cur();
  document.getElementById("app").innerHTML = p ? planView(p) : homeView();
}

function homeView() {
  const now = new Date();
  const first = iso(new Date(now.getFullYear(), now.getMonth(), 1));
  const last = iso(new Date(now.getFullYear(), now.getMonth() + 1, 0));
  const list = S.plans.slice().sort((a, b) => b.start.localeCompare(a.start)).map(p => {
    const s = stats(p);
    return `<div class="card">
      <div class="row between">
        <div class="grow"><h3>${esc(p.name)}</h3><div class="muted small">${niceDate(p.start)} – ${niceDate(p.end)}</div></div>
        <button class="primary" data-action="open-plan" data-id="${p.id}">Open</button>
      </div>
      <div class="nums" style="margin-top:10px">
        <div><span class="muted">Planned balance</span><b>${money(s.plannedNet)}</b></div>
        <div><span class="muted">Actual balance</span><b class="${s.actualNet < 0 ? "exp" : "inc"}">${money(s.actualNet)}</b></div>
        <div><span class="muted">Spent</span><b>${money(s.actualExpense)} <span class="muted small">/ ${money(s.plannedExpense)}</span></b></div>
      </div></div>`;
  }).join("");
  return `
  <div class="row between"><h1>Budget Planner</h1>
    <label style="flex-direction:row;align-items:center;gap:8px">Currency <input data-change="currency" value="${esc(S.currency)}" placeholder="e.g. LKR, $" style="width:90px"></label></div>
  <p class="muted">Plan your income and expenses for a period, record what really happens, and see what is left.</p>
  ${accountCard()}
  <h2>New plan</h2>
  <form class="card f" data-form="plan">
    <label>Plan name<input name="name" required placeholder="e.g. December 2026"></label>
    <label>From<input type="date" name="start" value="${first}" required></label>
    <label>To<input type="date" name="end" value="${last}" required></label>
    <button class="primary" type="submit">Create plan</button>
  </form>
  <h2>Your plans</h2>
  ${list || '<div class="card empty">No plans yet. Create your first plan above.</div>'}
  <h2>Backup</h2>
  <div class="card">
    <p class="muted small" style="margin-top:0">Your data is stored only in this browser. Download a backup regularly, and restore it on another device.</p>
    <div class="row"><button data-action="export-json">Download backup</button><button data-action="import-json">Restore backup</button></div>
  </div>`;
}

function planView(p) {
  const s = stats(p);
  const tabs = [["items", "Plan"], ["tx", "Transactions"], ["sum", "Summary"]];
  return `
  <div class="row between">
    <div class="crumb"><button data-action="home">← Plans</button></div>
    <div class="row"><button data-action="dup-plan">Copy to next period</button><button data-action="export-csv">CSV</button><button class="danger" data-action="del-plan">Delete</button></div>
  </div>
  <h1 style="margin-top:12px">${esc(p.name)}</h1>
  <div class="muted">${niceDate(p.start)} – ${niceDate(p.end)} · ${daysBetween(p.start, p.end) + 1} days${sync.user ? ` · <span class="small" data-sync>${badge()}</span>` : ""}</div>
  <div class="grid" style="margin-top:12px">
    <div class="stat"><div class="l">Income received</div><div class="v inc">${money(s.actualIncome)}</div><div class="l">of ${money(s.plannedIncome)} planned</div></div>
    <div class="stat"><div class="l">Spent</div><div class="v exp">${money(s.actualExpense)}</div><div class="l">of ${money(s.plannedExpense)} planned</div></div>
    <div class="stat"><div class="l">Balance now</div><div class="v ${s.actualNet < 0 ? "exp" : ""}">${money(s.actualNet)}</div><div class="l">planned ${money(s.plannedNet)}</div></div>
  </div>
  <div class="tabs">${tabs.map(([k, n]) => `<button class="${ui.tab === k ? "on" : ""}" data-action="tab" data-tab="${k}">${n}</button>`).join("")}</div>
  ${ui.tab === "items" ? itemsTab(p, s) : ui.tab === "tx" ? txTab(p, s) : sumTab(p, s)}`;
}

function itemsTab(p, s) {
  const ed = p.items.find(i => i.id === ui.editItem);
  const cats = [...new Set(p.items.map(i => i.category).filter(Boolean))];
  const form = `
  <form class="card f" data-form="item">
    <label>Item name<input name="name" required placeholder="e.g. Rent, Salary" value="${esc(ed ? ed.name : "")}"></label>
    <label>Type<select name="type"><option value="expense" ${ed && ed.type === "income" ? "" : "selected"}>Expense</option><option value="income" ${ed && ed.type === "income" ? "selected" : ""}>Income</option></select></label>
    <label>Category<input name="category" list="cats" placeholder="e.g. Housing" value="${esc(ed ? ed.category : "")}"></label>
    <datalist id="cats">${cats.map(c => `<option value="${esc(c)}">`).join("")}</datalist>
    <label>Planned amount<input name="planned" inputmode="decimal" required placeholder="0" value="${ed ? ed.planned : ""}"></label>
    <div class="row"><button class="primary" type="submit">${ed ? "Save changes" : "Add to plan"}</button>${ed ? '<button type="button" data-action="cancel-edit">Cancel</button>' : ""}</div>
  </form>`;
  const group = (type, title) => {
    const arr = s.items.filter(i => i.type === type);
    return `<h2>${title} <span class="muted small">· planned ${money(sum(arr, i => i.planned))}</span></h2>` +
      (arr.length ? arr.map(itemCard).join("") : `<div class="card empty">Nothing planned yet.</div>`);
  };
  return form + group("income", "Planned income") + group("expense", "Planned expenses");
}

function itemCard(it) {
  const st = status(it), isInc = it.type === "income";
  const w = Math.max(0, Math.min(100, it.pct));
  const remLabel = isInc ? "To receive" : "Remaining";
  const rem = it.remaining < 0 ? `${isInc ? "Extra" : "Over by"} ${money(-it.remaining)}` : money(it.remaining);
  return `<div class="card">
    <div class="row between">
      <div class="grow"><h3>${esc(it.name)}</h3><div class="muted small">${esc(it.category || "No category")}</div></div>
      <span class="chip ${st.c}">${st.t}</span>
    </div>
    <div class="bar"><i class="${st.c} ${isInc ? "in" : ""}" style="width:${w}%"></i></div>
    <div class="nums">
      <div><span class="muted">Planned</span><b>${money(it.planned)}</b></div>
      <div><span class="muted">${isInc ? "Received" : "Spent"}</span><b>${money(it.actual)}</b></div>
      <div><span class="muted">${remLabel}</span><b class="${it.remaining < 0 && !isInc ? "exp" : ""}">${rem}</b></div>
    </div>
    <div class="row" style="margin-top:8px">
      <button class="link" data-action="add-tx-for" data-id="${it.id}">+ ${isInc ? "Record income" : "Record spending"}</button>
      <button class="link" data-action="edit-item" data-id="${it.id}">Edit</button>
      <button class="link danger" data-action="del-item" data-id="${it.id}">Delete</button>
    </div></div>`;
}

function txTab(p, s) {
  const target = ui.txTarget || (p.items[0] ? "item:" + p.items[0].id : "u:expense");
  const today = todayISO();
  const date = ui.txDate || (today >= p.start && today <= p.end ? today : p.start);
  const opts = p.items.map(i => `<option value="item:${i.id}" ${target === "item:" + i.id ? "selected" : ""}>${esc(i.name)} (${i.type})</option>`).join("") +
    `<option value="u:expense" ${target === "u:expense" ? "selected" : ""}>Unplanned expense</option><option value="u:income" ${target === "u:income" ? "selected" : ""}>Unplanned income</option>`;
  const form = `
  <form class="card f" data-form="tx">
    <label>Date<input type="date" name="date" value="${date}" min="${p.start}" max="${p.end}" required></label>
    <label>For<select name="target">${opts}</select></label>
    <label>Amount<input name="amount" inputmode="decimal" required placeholder="0"></label>
    <label>Note (optional)<input name="note" placeholder="e.g. groceries"></label>
    <button class="primary" type="submit">Add</button>
  </form>`;
  const names = Object.fromEntries(p.items.map(i => [i.id, i.name]));
  const fopts = `<option value="all">All items</option>` + p.items.map(i => `<option value="${i.id}" ${ui.filter === i.id ? "selected" : ""}>${esc(i.name)}</option>`).join("") +
    `<option value="none" ${ui.filter === "none" ? "selected" : ""}>Unplanned only</option>`;
  let list = p.tx.slice().sort((a, b) => b.date.localeCompare(a.date) || 0);
  if (ui.filter === "none") list = list.filter(t => !t.itemId);
  else if (ui.filter !== "all") list = list.filter(t => t.itemId === ui.filter);
  const rows = list.map(t => `<div class="tx">
      <div class="d">${shortDate(t.date)}</div>
      <div class="m"><div>${esc(t.note || names[t.itemId] || "Unplanned")}</div><div class="muted small">${esc(t.itemId ? (names[t.itemId] || "") : "Unplanned")}</div></div>
      <div class="a ${t.type === "income" ? "inc" : "exp"}">${t.type === "income" ? "+" : "−"}${money(t.amount)}</div>
      <button class="link danger" data-action="del-tx" data-id="${t.id}" aria-label="Delete">✕</button></div>`).join("");
  return form + `<div class="row between"><h2 style="margin:6px 0">History</h2>
    <select data-change="filter">${fopts}</select></div>
    <div class="card">${rows || '<div class="empty">No transactions yet.</div>'}</div>`;
}

function sumTab(p, s) {
  const row = (label, planned, actual, cls) => `<tr><td>${label}</td><td style="text-align:right">${money(planned)}</td><td style="text-align:right" class="${cls}">${money(actual)}</td><td style="text-align:right">${money(planned - actual)}</td></tr>`;
  const today = todayISO();
  let allowance = "";
  if (today >= p.start && today <= p.end) {
    const left = daysBetween(today, p.end) + 1;
    const remain = s.plannedExpense - s.actualExpense;
    allowance = `<div class="card"><div class="muted small">Budget left for expenses · ${left} day${left > 1 ? "s" : ""} to go</div>
      <div class="row between"><div class="v" style="font-size:20px;font-weight:650;${remain < 0 ? "color:var(--exp)" : ""}">${remain < 0 ? "Over by " + money(-remain) : money(remain)}</div>
      <div class="muted">${remain >= 0 ? "≈ " + money(remain / left) + " per day" : ""}</div></div></div>`;
  } else if (today > p.end) {
    allowance = `<div class="card muted">This period has ended.</div>`;
  }
  const table = `<div class="card" style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:14px">
    <thead><tr class="muted small"><th style="text-align:left;font-weight:500"></th><th style="text-align:right;font-weight:500">Planned</th><th style="text-align:right;font-weight:500">Actual</th><th style="text-align:right;font-weight:500">Difference</th></tr></thead>
    <tbody>${row("Income", s.plannedIncome, s.actualIncome, "inc")}${row("Expenses", s.plannedExpense, s.actualExpense, "exp")}
    <tr style="border-top:1px solid var(--line);font-weight:650"><td>Balance</td><td style="text-align:right">${money(s.plannedNet)}</td><td style="text-align:right">${money(s.actualNet)}</td><td></td></tr></tbody></table>
    ${s.unplannedExpense || s.unplannedIncome ? `<p class="muted small" style="margin:10px 0 0">Unplanned: ${money(s.unplannedIncome)} income, ${money(s.unplannedExpense)} expenses (included above).</p>` : ""}
    <p class="muted small" style="margin:6px 0 0">Difference = planned − actual (for expenses, positive means money left in the budget).</p></div>`;

  // categories
  const cats = {};
  s.items.filter(i => i.type === "expense").forEach(i => { const k = i.category || "No category"; cats[k] = cats[k] || { planned: 0, actual: 0 }; cats[k].planned += i.planned; cats[k].actual += i.actual; });
  if (s.unplannedExpense) cats["Unplanned"] = { planned: 0, actual: s.unplannedExpense };
  const catRows = Object.entries(cats).sort((a, b) => b[1].actual - a[1].actual).map(([k, v]) => {
    const pct = v.planned > 0 ? v.actual / v.planned * 100 : 100;
    const cls = v.planned === 0 ? "over" : pct > 100 ? "over" : pct >= 80 ? "warn" : "";
    return `<div style="margin-bottom:12px"><div class="row between small"><span>${esc(k)}</span><span class="muted">${money(v.actual)}${v.planned ? " / " + money(v.planned) : ""}</span></div>
      <div class="bar"><i class="${cls}" style="width:${Math.min(100, pct)}%"></i></div></div>`;
  }).join("");

  // spending over time
  const days = daysBetween(p.start, p.end) + 1, weekly = days > 45;
  const buckets = {};
  p.tx.filter(t => t.type === "expense").forEach(t => {
    const k = weekly ? Math.floor(daysBetween(p.start, t.date) / 7) : daysBetween(p.start, t.date);
    buckets[k] = (buckets[k] || 0) + t.amount;
  });
  const n = weekly ? Math.ceil(days / 7) : days;
  const vals = Array.from({ length: n }, (_, i) => buckets[i] || 0);
  const max = Math.max(1, ...vals), W = 600, H = 150, bw = W / n;
  const bars = vals.map((v, i) => { const h = v / max * (H - 20); return `<rect x="${(i * bw + bw * 0.12).toFixed(1)}" y="${(H - 18 - h).toFixed(1)}" width="${(bw * 0.76).toFixed(1)}" height="${h.toFixed(1)}" rx="2" fill="var(--exp)" opacity="${v ? 0.85 : 0.15}"><title>${weekly ? "Week " + (i + 1) : shortDate(addDays(p.start, i))}: ${money(v)}</title></rect>`; }).join("");
  const chart = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Spending over time">${bars}
    <text x="0" y="${H - 3}" font-size="11" fill="var(--muted)">${shortDate(p.start)}</text>
    <text x="${W}" y="${H - 3}" font-size="11" text-anchor="end" fill="var(--muted)">${shortDate(p.end)}</text></svg>`;

  const over = s.items.filter(i => i.type === "expense" && i.pct > 100);
  const alerts = over.length ? `<div class="card"><h3 class="exp">Over budget</h3>${over.map(i => `<div class="row between small" style="margin-top:6px"><span>${esc(i.name)}</span><span class="exp">+${money(-i.remaining)}</span></div>`).join("")}</div>` : "";

  return allowance + table + alerts +
    `<h2>Expenses by category</h2><div class="card">${catRows || '<div class="empty">No expenses planned or recorded.</div>'}</div>` +
    `<h2>Spending ${weekly ? "per week" : "per day"}</h2><div class="card">${chart}</div>`;
}

/* ---------- actions ---------- */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const id = el.dataset.id, p = cur();
  switch (el.dataset.action) {
    case "open-plan": ui.planId = id; ui.tab = "items"; ui.editItem = null; ui.filter = "all"; ui.txTarget = ""; ui.txDate = ""; break;
    case "home": ui.planId = null; break;
    case "tab": ui.tab = el.dataset.tab; break;
    case "edit-item": ui.editItem = id; ui.tab = "items"; break;
    case "cancel-edit": ui.editItem = null; break;
    case "del-item": {
      const used = p.tx.filter(t => t.itemId === id).length;
      if (!confirm(used ? `This item has ${used} transaction(s). They will be kept as unplanned. Delete the item?` : "Delete this item?")) return;
      p.tx.forEach(t => { if (t.itemId === id) t.itemId = null; });
      p.items = p.items.filter(i => i.id !== id); if (ui.editItem === id) ui.editItem = null; save(); break;
    }
    case "add-tx-for": ui.tab = "tx"; ui.txTarget = "item:" + id; break;
    case "del-tx": if (!confirm("Delete this transaction?")) return; p.tx = p.tx.filter(t => t.id !== id); save(); break;
    case "del-plan": if (!confirm(`Delete "${p.name}" and all its data?`)) return; S.plans = S.plans.filter(x => x.id !== p.id); ui.planId = null; save(); break;
    case "dup-plan": {
      const len = daysBetween(p.start, p.end), start = addDays(p.end, 1);
      const np = { id: uid(), name: p.name + " (next)", start, end: addDays(start, len), items: p.items.map(i => ({ ...i, id: uid() })), tx: [] };
      S.plans.push(np); ui.planId = np.id; ui.tab = "items"; save(); alert("Copied to the next period. Adjust the planned amounts as needed."); break;
    }
    case "export-json": download("budget-backup-" + todayISO() + ".json", JSON.stringify(S, null, 2), "application/json"); return;
    case "import-json": document.getElementById("importFile").click(); return;
    case "export-csv": exportCSV(p); return;
    case "signup": authenticate("signup"); return;
    case "signout": signOut(); return;
    case "sync-now": pull(false); return;
  }
  render();
});

document.addEventListener("submit", e => {
  const form = e.target.closest("[data-form]");
  if (!form) return;
  e.preventDefault();
  if (form.dataset.form === "auth") { authenticate("signin"); return; }
  const f = Object.fromEntries(new FormData(form)), p = cur();
  if (form.dataset.form === "plan") {
    if (f.end < f.start) return alert("The end date must be on or after the start date.");
    const np = { id: uid(), name: f.name.trim(), start: f.start, end: f.end, items: [], tx: [] };
    S.plans.push(np); ui.planId = np.id; ui.tab = "items"; save();
  } else if (form.dataset.form === "item") {
    const planned = num(f.planned);
    if (!f.name.trim() || isNaN(planned) || planned < 0) return alert("Enter a name and a valid amount.");
    const data = { name: f.name.trim(), type: f.type, category: f.category.trim(), planned };
    if (ui.editItem) { Object.assign(p.items.find(i => i.id === ui.editItem), data); ui.editItem = null; }
    else p.items.push({ id: uid(), ...data });
    save();
  } else if (form.dataset.form === "tx") {
    const amount = num(f.amount);
    if (isNaN(amount) || amount <= 0) return alert("Enter an amount greater than 0.");
    if (f.date < p.start || f.date > p.end) return alert("The date must be inside the plan period.");
    let itemId = null, type;
    if (f.target.startsWith("item:")) { itemId = f.target.slice(5); type = p.items.find(i => i.id === itemId).type; }
    else type = f.target.slice(2);
    p.tx.push({ id: uid(), itemId, type, amount, date: f.date, note: f.note.trim() });
    ui.txTarget = f.target; ui.txDate = f.date; save();
    render(); const a = document.querySelector("[name=amount]"); if (a) a.focus(); return;
  }
  render();
});

document.addEventListener("change", e => {
  const k = e.target.dataset && e.target.dataset.change;
  if (k === "currency") { S.currency = e.target.value.trim(); save(); render(); }
  else if (k === "filter") { ui.filter = e.target.value; render(); }
  else if (e.target.id === "importFile") {
    const file = e.target.files[0]; if (!file) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const d = JSON.parse(r.result);
        if (!d || !Array.isArray(d.plans)) throw 0;
        if (!confirm("Replace all current data with this backup?")) return;
        S = d; ui.planId = null; save(); render();
      } catch (_) { alert("That file is not a valid backup."); }
    };
    r.readAsText(file); e.target.value = "";
  }
});

function download(name, text, type) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type }));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function exportCSV(p) {
  const q = v => '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"';
  const names = Object.fromEntries(p.items.map(i => [i.id, i]));
  const rows = [["Date", "Type", "Planned item", "Category", "Amount", "Note"]];
  p.tx.slice().sort((a, b) => a.date.localeCompare(b.date)).forEach(t => rows.push([t.date, t.type, t.itemId ? names[t.itemId].name : "Unplanned", t.itemId ? names[t.itemId].category : "", t.amount, t.note]));
  download((p.name.replace(/[^\w-]+/g, "_") || "plan") + ".csv", rows.map(r => r.map(q).join(",")).join("\n"), "text/csv");
}

render();
initSync();
</script>
</body>
</html>
